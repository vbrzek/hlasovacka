<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Hlasování</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 28px 22px calc(40px + env(safe-area-inset-bottom)); }
  .logo { max-height: 56px; max-width: 70%; margin: 4px auto 28px; object-fit: contain; }
  .intro { width: 100%; border-radius: 14px; margin-bottom: 26px; }
  .wait { text-align: center; padding: 8px 4px; }
  .wait h2 { font-size: 24px; font-weight: 700; margin: 0 0 10px; }
  .wait p { color: var(--muted); font-size: 17px; line-height: 1.45; margin: 0; }
  .dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  h1.q { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.18; margin: 0 0 24px; white-space: pre-line; }
  .opt {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    text-align: left; background: #fff; border: 1.5px solid #9a9ca5; border-radius: 40px;
    padding: 22px 22px 22px 28px; margin-bottom: 14px; font-size: 19px; color: var(--ink);
    -webkit-tap-highlight-color: transparent; transition: background .15s, border-color .15s;
  }
  .opt .dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #9a9ca5; flex: none; }
  .opt:active { background: var(--soft); }
  .opt.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); }
  .opt.sel .dot { border: 9px solid var(--c); }
  .opt:disabled { cursor: default; }

  .res { margin-bottom: 20px; }
  .res .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 18px; margin-bottom: 8px; }
  .res .row b { font-variant-numeric: tabular-nums; flex: none; }
  .res .mine { font-weight: 700; }
  .track { height: 14px; border-radius: 7px; background: #eef0f5; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--c); border-radius: 7px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .thanks { text-align: center; color: var(--muted); font-size: 16px; margin-top: 26px; }
  .err { color: var(--danger); text-align: center; margin-top: 10px; min-height: 1.2em; }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: #fff4d6; color: #7a5a00; text-align: center; font-size: 14px; padding: 6px; display: none; }
  .offline.on { display: block; }
</style>
</head>
<body>
<div class="offline" id="offline">Připojování…</div>
<div class="wrap" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/vote.js"></script>
</body>
</html>
