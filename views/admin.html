<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrace prezentace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: var(--soft); font-size: 15px; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { color: var(--muted); font-size: 13px; }
  #status.err { color: var(--danger); font-weight: 600; }
  main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 440px; gap: 20px; padding: 20px; align-items: start; }
  @media (max-width: 1200px) { main { grid-template-columns: 220px minmax(0, 1fr); } .control { grid-column: 1 / -1; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: #fff; border-radius: 16px; padding: 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }

  /* seznam slajdů */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
  .item:hover { background: var(--soft); }
  .item.sel { border-color: var(--accent); background: #f2f4ff; }
  .item .n { width: 20px; color: var(--muted); font-size: 13px; text-align: right; flex: none; }
  .item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .ty { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--soft); color: var(--muted); flex: none; }
  .item.live .n::before { content: '●'; color: #e5312a; margin-right: 2px; }
  .item .mv { display: none; gap: 2px; flex: none; }
  .item:hover .mv, .item.sel .mv { display: flex; }
  .mv button { border: 0; background: none; padding: 0 3px; color: var(--muted); }
  .mv button:hover { color: var(--ink); }
  .adds { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  /* rekapitulace odkazů */
  .urls { display: flex; flex-direction: column; gap: 14px; }
  .url b { display: block; font-size: 14px; }
  .url .hint { display: block; font-size: 12px; margin-bottom: 4px; }
  .url code { display: block; font-size: 12px; color: var(--muted); background: var(--soft); padding: 6px 8px; border-radius: 8px; overflow-wrap: anywhere; margin-bottom: 6px; user-select: all; }
  .url div { display: flex; gap: 6px; }
  .url .btn { padding: 5px 10px; font-size: 13px; }

  /* editor */
  label.f { display: block; font-weight: 600; font-size: 13px; margin: 18px 0 6px; }
  label.f:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  input[type=text], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { resize: vertical; min-height: 80px; font-size: 17px; }
  .imgbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .imgbox img { max-height: 90px; max-width: 220px; border-radius: 8px; border: 1px solid var(--line); }
  .opts .o { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opts input[type=color] { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: #fff; flex: none; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .links .l { margin-bottom: 14px; }
  .links .l b { display: block; font-size: 13px; margin-bottom: 4px; }
  .links .l div { display: flex; gap: 6px; }
  .links input { font-size: 13px; color: var(--muted); }

  /* ovládání */
  .preview { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .nowplaying { margin: 12px 0; font-size: 14px; }
  .nowplaying b { font-size: 16px; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nav .btn { padding: 14px; font-size: 16px; }
  .nav .wide { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .kbd { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="htitle">…</h1>
  <span id="status"></span>
  <a class="btn" id="openScreen" target="_blank">Otevřít plátno ↗</a>
</header>
<main>
  <div class="side">
    <aside class="panel">
      <h2>Slajdy</h2>
      <div class="list" id="list"></div>
      <div class="adds">
        <button class="btn dark" id="addChoice">+ Otázka (výběr)</button>
        <button class="btn" id="addStatic">+ Statický slajd</button>
      </div>
    </aside>
    <aside class="panel">
      <h2>Odkazy</h2>
      <div class="urls" id="urls"></div>
    </aside>
  </div>
  <section class="panel" id="editor"></section>
  <aside class="panel control">
    <h2>Promítání</h2>
    <div class="preview"><iframe id="preview" title="Náhled plátna"></iframe></div>
    <div class="nowplaying" id="now"></div>
    <div class="nav">
      <button class="btn" id="prev">◀ Předchozí</button>
      <button class="btn primary" id="next">Další ▶</button>
      <button class="btn wide" id="lobby">Úvod s QR kódem</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sVoters">0</b><span>připojených hlasujících</span></div>
      <div class="stat"><b id="sVotes">–</b><span>hlasů u aktuální otázky</span></div>
    </div>
    <div class="kbd">Klávesy: → / PageDown další, ← / PageUp předchozí (funguje i s prezentérem).</div>
  </aside>
</main>
<input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
