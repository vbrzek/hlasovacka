<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlasování – nová prezentace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--soft); padding: 16px; }
  .card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 520px; box-shadow: 0 10px 40px rgba(20,20,40,.08); }
  h1 { font-size: 34px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 17px; margin-bottom: 16px; }
  .btn { width: 100%; padding: 14px; font-size: 16px; }
  .err { color: var(--danger); margin-top: 12px; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Nová prezentace</h1>
  <p>Vytvořte si prezentaci se statickými slajdy a hlasováním. Dostanete odkaz pro administraci, pro plátno a pro hlasující.</p>
  <input name="title" placeholder="Název prezentace" maxlength="200" required autofocus>
  <button class="btn primary">Vytvořit prezentaci</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const r = await fetch('/api/presentations', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: e.target.title.value }),
    });
    const j = await r.json();
    location.href = j.adminUrl;
  } catch {
    document.getElementById('err').textContent = 'Nepodařilo se vytvořit prezentaci.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
